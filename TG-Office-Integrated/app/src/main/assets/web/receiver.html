<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TeGe Office · Presentasi ke Layar Lain</title>
<link rel="icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<style>
@font-face{font-family:"Plus Jakarta Sans";src:url("fonts/PlusJakartaSans-Variable.ttf") format("truetype");font-weight:200 800;font-display:swap}
html,body{margin:0;height:100%;background:#0A0F18;color:#fff;font-family:'Plus Jakarta Sans',system-ui,sans-serif;overflow:hidden}
.rx-gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(120% 100% at 50% 0%,#16243A,#0A0F18);z-index:3000;text-align:center;padding:24px}
.rx-gate.hidden,.hidden{display:none!important}
.rx-logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#3A86E0,#0F3F8C);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.rx-gate h1{margin:0;font-size:clamp(20px,3vw,30px);font-weight:800}
.rx-gate p{margin:0;color:#A9B8CB;font-size:clamp(14px,1.6vw,18px)}
.rx-code{font:800 clamp(34px,6vw,64px)/1 'Plus Jakarta Sans',system-ui,sans-serif;letter-spacing:.4em;text-indent:.4em;width:min(80vw,380px);text-align:center;padding:16px 8px;border-radius:18px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;outline:none}
.rx-code:focus{border-color:#7DB2FF}
.rx-btn{border:0;border-radius:16px;background:#7DB2FF;color:#0B1A2E;font:800 18px 'Plus Jakarta Sans',system-ui,sans-serif;padding:14px 32px;cursor:pointer}
.rx-err{color:#FFB4AB!important;min-height:1.4em}
.rx-note{font-size:13px!important;opacity:.8}
.rx-host{position:fixed;left:-99999px;top:0;width:1280px;height:720px;overflow:hidden}
.ppt-present-nav,.ppt-present-close,.ppt-present-hud,.ppt-present-count{display:none!important}
.rx-ink{position:fixed;inset:0;z-index:1100;touch-action:none;pointer-events:none}
.rx-ink.on{pointer-events:auto;cursor:crosshair}
.rx-laser{position:fixed;z-index:1110;display:none;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#FF2A2A;pointer-events:none}
.rx-spot{position:fixed;inset:0;z-index:1105;display:none;pointer-events:none;background:radial-gradient(circle at var(--x,50%) var(--y,50%),transparent 0,transparent var(--r,120px),rgba(0,0,0,.84) calc(var(--r,120px) + 18px))}
.rx-black{position:fixed;inset:0;z-index:1200;background:#000;display:none;align-items:flex-end;justify-content:center;padding-bottom:20px;color:#333;font-size:13px}
.rx-black.on{display:flex}
.rx-bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:1300;display:flex;align-items:center;gap:4px;padding:8px 14px;border-radius:40px;background:rgba(20,30,46,.9);border:1px solid rgba(255,255,255,.16);box-shadow:0 18px 40px -14px rgba(0,0,0,.8);transition:opacity .3s}
.rx-bar.fade{opacity:0;pointer-events:none}
.rx-bar button{width:54px;height:54px;border:0;border-radius:27px;background:transparent;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 10px 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer}
.rx-bar button svg{fill:currentColor}
.rx-bar button.on{background:rgba(125,178,255,.28);box-shadow:inset 0 0 0 2px #7DB2FF}
.rx-count{min-width:76px;text-align:center;font-weight:800;font-size:18px}
.rx-sep{width:1px;height:40px;background:rgba(255,255,255,.2);margin:0 6px}
.rx-pop{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);z-index:1300;display:flex;gap:10px;align-items:center;padding:10px 16px;border-radius:30px;background:rgba(20,30,46,.95);border:1px solid rgba(255,255,255,.16)}
.rx-pop button{width:34px;height:34px;border-radius:50%;border:0;cursor:pointer}
.rx-pop button.on{box-shadow:0 0 0 3px #0B1220,0 0 0 5px #fff}
.rx-pop .sz{background:rgba(255,255,255,.12);border-radius:12px;width:42px;display:flex;align-items:center;justify-content:center}
.rx-pop .sz i{display:block;border-radius:50%;background:#fff}
.rx-status{position:fixed;left:12px;top:8px;z-index:1300;font-size:12px;font-weight:700;color:#A9B8CB;display:flex;gap:6px;align-items:center;transition:opacity .4s}
.rx-status i{width:8px;height:8px;border-radius:50%;background:#2FB36B}
.rx-status.off i{background:#F2A900}
.rx-loading{position:fixed;inset:0;z-index:2500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0A0F18;color:#A9B8CB;font-size:16px}
.rx-spin{width:42px;height:42px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:#7DB2FF;animation:rxspin .8s linear infinite}
@keyframes rxspin{to{transform:rotate(360deg)}}
.rx-bar button{position:relative}
.rx-bar button[style*="--dot"]::after{content:"";position:absolute;right:9px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--dot);box-shadow:0 0 0 2px #141E2E}
.rx-pop{padding:8px 8px 8px 16px}
.rx-pop.hidden{display:none}
.rx-psep{width:1px;height:30px;background:rgba(255,255,255,.22)}
.rx-pop .tz{width:auto;min-width:54px;height:42px;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-weight:800;display:flex;align-items:baseline;justify-content:center;gap:4px;padding:0 10px;font-family:inherit}
.rx-pop .tz small{font-size:10px;opacity:.75}
.rx-pop .tz.on{box-shadow:inset 0 0 0 2px #7DB2FF;background:rgba(125,178,255,.25)}
.rx-hint{white-space:nowrap;font-size:12px;color:#A9B8CB;font-weight:700;margin-right:4px}
.rx-pop .rx-x{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;margin-left:4px}
.rx-pop .rx-x svg{fill:#fff}
.rx-tbox{position:fixed;z-index:1350;display:flex;gap:6px;align-items:center;padding:6px;border-radius:16px;background:rgba(20,30,46,.95);border:1px solid rgba(255,255,255,.2)}
.rx-tbox input{width:300px;max-width:50vw;height:46px;border:2px solid #7DB2FF;border-radius:12px;background:rgba(255,255,255,.95);font:800 18px 'Plus Jakarta Sans',system-ui,sans-serif;padding:0 10px;outline:none}
.rx-tbox button{width:44px;height:44px;border:0;border-radius:12px;background:#7DB2FF;display:flex;align-items:center;justify-content:center;cursor:pointer}
.rx-tbox button[data-cancel]{background:rgba(255,255,255,.14)}.rx-tbox button svg{fill:#0B1A2E}.rx-tbox button[data-cancel] svg{fill:#fff}
</style>
</head>
<body>
<form class="rx-gate" id="gate" autocomplete="off">
  <div class="rx-logo">TG</div>
  <h1>TeGe Office · Presentasi ke Layar Lain</h1>
  <p>Masukkan kode 4 angka yang tampil di HP pengajar</p>
  <input class="rx-code" id="code" inputmode="numeric" pattern="[0-9]*" maxlength="4" aria-label="Kode pairing" autofocus>
  <button class="rx-btn" type="submit">Sambungkan</button>
  <p class="rx-err" id="err"></p>
  <p class="rx-note">Hanya jaringan lokal. File tidak dikirim ke server luar.</p>
</form>
<div class="rx-loading hidden" id="loading"><div class="rx-spin"></div><div id="loadingText">Memuat presentasi…</div></div>
<div class="rx-host" id="host"></div>
<script type="module" src="js/receiver.js"></script>
</body>
</html>
